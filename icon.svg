<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle (as seen in screenshot) -->
  <circle cx="50" cy="50" r="45" fill="#F0F0F0" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Pixel Art Soul Character (1:1 Reconstruction) -->
  <!-- Using a grid-based approach to ensure pixel-perfect look -->
  <g fill="#9FA8DA" transform="translate(25, 28) scale(4.5)">
    <!-- Row 1: The "Ears/Horns" -->
    <rect x="0" y="0" width="2" height="2"/>
    <rect x="9" y="0" width="2" height="2"/>
    
    <!-- Row 2: Head top -->
    <rect x="1" y="2" width="9" height="1"/>
    
    <!-- Row 3: Forehead -->
    <rect x="0" y="3" width="11" height="1"/>
    
    <!-- Row 4: Eyes level -->
    <rect x="0" y="4" width="2" height="2"/>
    <rect x="4" y="4" width="3" height="2"/>
    <rect x="9" y="4" width="2" height="2"/>
    <!-- Eyes (White Pixels) -->
    <rect x="2" y="4" width="2" height="2" fill="white"/>
    <rect x="7" y="4" width="2" height="2" fill="white"/>
    
    <!-- Row 5: Mouth/Body -->
    <rect x="0" y="6" width="11" height="2"/>
    
    <!-- Row 6: Tapered body -->
    <rect x="1" y="8" width="9" height="1"/>
    
    <!-- Row 7: Legs/Jagged bottom -->
    <rect x="0" y="9" width="2" height="2"/>
    <rect x="4" y="9" width="3" height="2"/>
    <rect x="9" y="9" width="2" height="2"/>
  </g>
</svg>
