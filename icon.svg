<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Glow -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Brain Shape (Abstract) -->
  <path d="M100 20 C60 20 30 50 30 90 C30 110 40 125 55 135 C55 160 75 180 100 180 C125 180 145 160 145 135 C160 125 170 110 170 90 C170 50 140 20 100 20 Z" 
        fill="none" stroke="#00D2FF" stroke-width="6" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- Central "S" for Soul -->
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="#00D2FF" text-anchor="middle" filter="url(#glow)">
    S
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
  </text>

  <!-- Circuit Lines -->
  <line x1="100" y1="20" x2="100" y2="40" stroke="#3A7BD5" stroke-width="4" />
  <line x1="100" y1="180" x2="100" y2="160" stroke="#3A7BD5" stroke-width="4" />
  <line x1="30" y1="90" x2="50" y2="90" stroke="#3A7BD5" stroke-width="4" />
  <line x1="170" y1="90" x2="150" y2="90" stroke="#3A7BD5" stroke-width="4" />

  <!-- The "Tarik" Pulse -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#00D2FF" stroke-width="1" stroke-dasharray="10,20">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite" />
  </circle>
</svg>
